name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]' flake8 black
      - name: Lint
        run: |
          black --check --diff -l 120 lab3d tests
          flake8 lab3d tests
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Layout validation: every captured and fully populated model places all its slotted parts, inside the
      # chassis, with no two parts in the same space.
      - name: Test (vitest)
        run: npm test
      - name: Type-check and build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t 3d-lab:ci .
      - name: Smoke test
        run: |
          docker run -d --name se -p 8080:8080 3d-lab:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "<title>3D Lab</title>"
          docker exec se 3d-lab healthcheck
